<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>提示词生成器 · booru tag picker</title>
<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --border: #e6e8ee;
    --text: #1a1d27;
    --muted: #697079;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-soft: #eef0ff;
    --chip-hover: #f1f2f7;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --shadow-lg: 0 8px 24px rgba(16,24,40,.12);
    --radius: 12px;
    --tabbar-h: 56px;
    --header-h: 100px;
  }
  [data-theme="dark"] {
    --bg: #0f1115; --card: #171a21; --border: #262b35; --text: #e6e8ee;
    --muted: #9aa3b2; --accent: #818cf8; --accent-2: #a78bfa; --accent-soft: #232838; --chip-hover: #242936;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
  }
  [data-theme="dark"] .warnings { background: #3a2f1a; border-color: #6b5315; color: #e8c46a; }
  [data-theme="dark"] .label.pos { color: #7bd69a; background: #1f3a2a; }
  [data-theme="dark"] .label.neg { color: #f08a82; background: #3a1f1d; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  html { overflow-y: scroll; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 12px;
    box-shadow: 0 1px 8px rgba(16,24,40,.05);
  }
  header .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .top-actions { display: flex; align-items: center; gap: 6px; }
  .top-actions .btn { padding: 6px 10px; font-size: 13px; }
  header h1 {
    margin: 0; font-size: 17px; font-weight: 700;
    letter-spacing: 0.2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search-wrap { flex: 1 1 200px; min-width: 160px; position: relative; }
  .search-wrap input[type="search"] {
    width: 100%;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 14px; outline: none;
  }
  .search-wrap input[type="search"]:focus { border-color: var(--accent); }
  .suggest {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 320px; overflow-y: auto;
  }
  .suggest-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .suggest-item:hover { background: var(--chip-hover); }
  .suggest-item .en { color: var(--muted); font-size: 12px; }
  .suggest-item .fav { margin-left: auto; border: none; background: transparent; cursor: pointer; font-size: 15px; color: var(--muted); padding: 2px 5px; }
  .suggest-item .fav.on { color: #f5b301; }
  .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

  main {
    max-width: 980px; margin: 0 auto;
    padding: 16px 20px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 72px);
  }
  .tab-page { display: none; }
  .tab-page.active { display: block; }
  details {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow .15s;
    scroll-margin-top: 128px;
  }
  details[open] { box-shadow: var(--shadow-lg); }
  summary {
    cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 15px;
    user-select: none; list-style: none; display: flex; justify-content: space-between;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--muted); }
  details[open] summary::after { content: "▴"; }
  summary .tag-count { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; padding: 12px 16px 16px; }
  .subgroup-label {
    width: 100%; margin: 6px 0 2px; padding: 2px 0 0;
    font-size: 12px; font-weight: 700; color: var(--accent);
    border-top: 1px solid var(--border);
  }
  .chip {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; user-select: none;
    transition: background .12s, border-color .12s, color .12s, transform .12s, box-shadow .12s;
  }
  .chip:hover { background: var(--chip-hover); transform: translateY(-1px); box-shadow: var(--shadow); }
  .chip.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .chip.conflict { border-color: #e5484d; color: #c0353a; }
  .chip.active.conflict { background: #e5484d; border-color: #e5484d; color: #fff; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--border); }
  .col-btns { display: flex; gap: 6px; }

  .result-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--card); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.22);
    max-height: 85vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .25s ease;
  }
  .result-bar.open { transform: translateY(0); }
  .backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.4); opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .fab {
    position: fixed; right: 16px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); z-index: 35;
    padding: 10px 16px; border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    font-size: 14px; box-shadow: var(--shadow-lg);
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .drawer-title { font-weight: 700; font-size: 15px; }
  .warnings {
    max-width: 980px; margin: 0 auto 8px; padding: 8px 12px;
    background: #fff4e5; border: 1px solid #f0c36d; border-radius: 8px;
    color: #8a5a00; font-size: 13px;
  }
  .result-bar .row { display: flex; gap: 12px; align-items: stretch; max-width: 980px; margin: 0 auto; }
  .result-col { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .col-head { display: flex; align-items: center; justify-content: space-between; }
  .label { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
  .label.pos { color: #1a7f37; background: #e6f4ea; }
  .label.neg { color: #b42318; background: #fdecea; }
  .result-bar textarea {
    width: 100%; min-height: 56px; resize: vertical;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg);
  }
  .btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text); font-size: 14px; cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn:active { transform: translateY(0); }

  .empty-tip { color: var(--muted); text-align: center; padding: 24px 0; }
  .custom-row { display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
  .custom-row input { flex: 1 1 140px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; }
  .custom-row select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--card); color: var(--text); }
  .sel-panel { max-width: 980px; margin: 0 auto 8px; }
  .sel-panel summary { padding: 6px 0; font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
  .sel-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; margin-bottom: 8px; }
  .sel-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .sel-label { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: grab; user-select: none; }
  .sel-label:active { cursor: grabbing; }
  .sel-item input[type="range"] { flex: 0 0 90px; }
  .sel-item .del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 5px; }
  .sel-item .del:hover { color: #d33; }
  .custom-row input:focus { border-color: var(--accent); }
  .custom-row .btn { flex: 0 0 auto; }
  .custom-chip { display: inline-flex; align-items: center; }
  .custom-chip .del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 5px; border-radius: 4px; }
  .custom-chip .del:hover { color: #d33; }

  /* ===== 底部 Tab 栏 ===== */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--card); border-top: 1px solid var(--border);
    height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box;
  }
  .tabbar button {
    flex: 1; height: var(--tabbar-h); border: none; background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .tabbar button .ico { font-size: 20px; line-height: 1; }
  .tabbar button.active { color: var(--accent); font-weight: 600; }

  /* ===== 分类快捷索引 ===== */
  #cat-nav {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 0 12px; margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  #cat-nav button {
    flex: 0 0 auto; padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--card); color: var(--text);
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #cat-nav button:active { border-color: var(--accent); color: var(--accent); }

  /* ===== 响应式：宽屏侧边栏，窄屏顶部横栏 ===== */
  @media (min-width: 900px) {
    #tab-prompt.active {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .cat-nav-wrap {
      position: sticky;
      top: calc(var(--header-h) + 12px);
      align-self: start;
      height: calc(100vh - var(--header-h) - var(--tabbar-h) - 36px);
      overflow-y: auto;
    }
    #cat-nav {
      flex-direction: column;
      gap: 6px;
      padding: 0;
      margin: 0;
      overflow-x: visible;
    }
    #cat-nav button {
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      white-space: normal;
      flex: 0 0 auto;
    }
  }

  /* ===== 结果栏动作条 ===== */
  .action-strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 980px; margin: 0 auto 8px; }
  .action-strip .grow { flex: 1 1 auto; }
  .action-strip select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--card); color: var(--text); outline: none;
  }
  .import-row { display: flex; gap: 8px; align-items: center; }
  .import-row input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--card); color: var(--text); outline: none;
  }

  /* ===== 图库 ===== */
  #skeleton-section, #depth-section { background: transparent; border: none; box-shadow: none; margin-bottom: 8px; }
  #skeleton-section summary, #depth-section summary {
    cursor: pointer; font-size: 15px; font-weight: 700; color: var(--accent); padding: 6px 2px;
  }
  #skeleton-section summary .sub, #depth-section summary .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  #skeleton-grid, #depth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }

  @media (max-width: 640px) {
    .result-bar .row { flex-direction: column; }
    header { padding: 10px 14px 10px; }
    header h1 { font-size: 16px; }
    .toolbar { gap: 8px; }
    .search-wrap { flex: 1 1 100%; min-width: 100%; }
    .btn { padding: 8px 12px; font-size: 13px; min-height: 40px; }
    .count { font-size: 12px; }
    main { padding: 12px 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 72px); }
    .result-bar { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
    .result-bar textarea { min-height: 44px; font-size: 12px; }
  }
</style>

<body>
<header>
  <div class="top">
    <h1>提示词生成器</h1>
    <div class="top-actions">
      <span class="count" id="count">已选 0</span>
      <button class="btn" id="theme-toggle">🌙</button>
      <button class="btn" id="fullscreen-toggle">⛶ 全屏</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="search" id="search" placeholder="搜索标签（中文 / 英文）">
      <div id="suggest" class="suggest" style="display:none"></div>
    </div>
  </div>
</header>

<main>
  <section id="tab-prompt" class="tab-page active">
    <div class="cat-nav-wrap"><div id="cat-nav"></div></div>
    <div id="categories"></div>
  </section>

  <section id="tab-gallery" class="tab-page">
    <!-- 骨骼图库（可折叠） -->
    <details id="skeleton-section">
      <summary>📁 骨骼图库 <span class="sub">（点击折叠/展开 · 缩略图点开看大图 · 下载姿势拿 JSON）</span></summary>
      <div id="skeleton-grid"></div>
    </details>

    <!-- 深度图库（可折叠 · 图片由用户自行上传） -->
    <details id="depth-section">
      <summary>📁 深度图库 <span class="sub">（点击折叠/展开 · 缩略图点开看大图 · 下载 PNG）</span></summary>
      <div id="depth-grid"></div>
    </details>
  </section>

  <section id="tab-library" class="tab-page">
    <div id="library-sections"></div>
  </section>
</main>

<nav class="tabbar">
  <button data-tab="prompt" class="active"><span class="ico">🏷</span><span>标签</span></button>
  <button data-tab="gallery"><span class="ico">🖼</span><span>图库</span></button>
  <button data-tab="library"><span class="ico">📚</span><span>我的</span></button>
</nav>

<div class="backdrop" id="backdrop"></div>
<div class="result-bar" id="result-bar">
  <div class="drawer-head">
    <span class="drawer-title">输出</span>
    <button class="btn" id="drawer-close" title="收起">✕</button>
  </div>
  <div id="warnings" class="warnings" style="display:none"></div>
  <div class="action-strip">
    <button class="btn" id="undo" title="撤销">↶</button>
    <button class="btn" id="redo" title="重做">↷</button>
    <button class="btn" id="clear">清空</button>
    <button class="btn" id="random">🎲 随机</button>
    <span class="grow"></span>
    <select id="format-select" title="输出格式">
      <option value="weight">(tag:1.2) 权重</option>
      <option value="plain">纯标签（无权重）</option>
    </select>
  </div>
  <details class="sel-panel" id="sel-panel" open>
    <summary>已选标签（拖拽排序 · 滑杆调权重）</summary>
    <div class="sel-list" id="sel-list"></div>
  </details>
  <details class="sel-panel" id="import-panel">
    <summary>导入提示词（用 --neg 分隔负面）</summary>
    <div class="import-row">
      <input id="import-input" type="text" placeholder="如 1girl, no pants --neg lowres, bad hands">
      <button class="btn primary" id="import-btn">导入</button>
    </div>
  </details>
  <div class="row">
    <div class="result-col">
      <div class="col-head"><span class="label pos">正面</span><span class="col-btns"><button class="btn primary" id="copy-pos">复制</button><button class="btn" id="copy-all">合并复制</button></span></div>
      <textarea id="result-pos" readonly placeholder="点选标签，正面提示词出现在这里…"></textarea>
    </div>
    <div class="result-col">
      <div class="col-head"><span class="label neg">负面</span><span class="col-btns"><button class="btn" id="neg-all">全选</button><button class="btn" id="copy-neg">复制</button></span></div>
      <textarea id="result-neg" readonly placeholder="「负面」分类里的标签出现在这里…"></textarea>
    </div>
  </div>
</div>

<button class="fab" id="output-fab">📋 已选 0</button>

// 历史记录（撤销/重做）
let history = [];
let redoStack = [];
const MAX_HISTORY = 50;
function snapshot() {
  history.push({ selected: selected.slice(), weights: Object.assign({}, weights) });
  if (history.length > MAX_HISTORY) history.shift();
  redoStack.length = 0;
}
function restore(st) {
  selected.length = 0;
  st.selected.forEach(en => selected.push(en));
  Object.keys(weights).forEach(k => delete weights[k]);
  Object.assign(weights, st.weights);
  render();
}
function undo() {
  if (history.length === 0) return;
  const st = history.pop();
  redoStack.push({ selected: selected.slice(), weights: Object.assign({}, weights) });
  restore(st);
}
function redo() {
  if (redoStack.length === 0) return;
  const st = redoStack.pop();
  history.push({ selected: selected.slice(), weights: Object.assign({}, weights) });
  restore(st);
}

function tagRank(en) {
  const tw = triggerWords.findIndex(t => t.en === en);
  if (tw >= 0) return -1000 + tw; // LoRA 触发词排最前
  for (let i = 0; i < CATEGORIES.length; i++) {
    const cat = CATEGORIES[i];
    const ti = cat.tags.findIndex(t => t.en === en);
    if (ti >= 0) return 1000 + i * 100 + ti;
    const ci = customTags.findIndex(t => t.en === en && t.cat === cat.name);
    if (ci >= 0) return 1000 + i * 100 + cat.tags.length + ci;
  }
  return 99999;
}

function cycleWeight(en) {

  const cur = weights[en] || 1.0;

}

function preciseWeight(en) {
  if (!selected.includes(en)) return;
  const cur = weights[en] || 1.0;

  const v = parseFloat(input);
  if (isNaN(v) || v <= 0) return;
  weights[en] = Math.round(v * 100) / 100;
  render();
}

function fmt(en) {
  const w = weights[en] || 1.0;
  return w !== 1.0 ? "(" + en + ":" + w.toFixed(1) + ")" : en;
}

function checkIssues() {
  const issues = [];
  const conflictTags = new Set();
  CONFLICT_GROUPS.forEach(g => {
    const hit = g.tags.filter(t => selected.includes(t));
    if (hit.length >= 2) { issues.push("冲突【" + g.name + "】" + hit.join(" + ")); hit.forEach(t => conflictTags.add(t)); }
  });
  const seen = new Set();
  const dups = [];
  selected.forEach(en => { if (seen.has(en)) dups.push(en); else seen.add(en); });
  if (dups.length) { issues.push("重复标签: " + [...new Set(dups)].join(", ")); dups.forEach(t => conflictTags.add(t)); }
  return { issues, conflictTags };
}

function makeTagChip(t, opts) {
  const box = document.createElement("span");

  b.addEventListener("mousedown", e => { e.preventDefault(); beginDrag(e, t.en); });
  b.addEventListener("mouseenter", () => applyDrag(t.en));
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTag(t.en); } });
  b.addEventListener("contextmenu", e => { e.preventDefault(); (e.shiftKey ? preciseWeight(t.en) : cycleWeight(t.en)); });

  if (opts.withDelete) {
    const del = document.createElement("button");

    box.appendChild(del);
  }

function parseTags(str) {
  return (str || "").split(/[,，]/).map(s => s.trim().replace(/\s+/g, " ").toLowerCase()).filter(Boolean);
}

function importPrompt() {
  const input = document.getElementById("import-input");
  const raw = (input.value || "").trim();
  if (!raw) return;
  snapshot();
  const parts = raw.split(/\s*--neg\s*/i);
  const apply = (str, negMode) => {
    parseTags(str).forEach(part => {
      let tag = part, w = 1.0;
      const wm = part.match(/^\((.+?):([\d.]+)\)$/);
      if (wm) { tag = wm[1].trim(); w = parseFloat(wm[2]) || 1.0; }
      if (!tag) return;
      if (negMode) {
        if (isNeg(tag)) {
          if (!selected.includes(tag)) insertSorted(tag);
        } else if (!extraNeg.includes(tag)) {
          extraNeg.push(tag);
        }
        weights[tag] = w;
      } else {
        if (!selected.includes(tag)) insertSorted(tag);
        weights[tag] = w;
      }
    });
  };
  apply(parts[0] || "", false);
  apply(parts[1] || "", true);
  input.value = "";
  render();
}

function importConfig(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object") throw new Error("bad");
      if (Array.isArray(data.presets)) {
        data.presets.forEach(p => {
          if (p && typeof p.name === "string" && Array.isArray(p.pos) && Array.isArray(p.neg)) {
            const ex = presets.find(x => x.name === p.name);
            if (ex) { ex.pos = p.pos; ex.neg = p.neg; }
            else presets.push({ name: p.name, pos: p.pos, neg: p.neg });
          }
        });
      }
      if (Array.isArray(data.customTags)) {
        data.customTags.forEach(t => {
          if (t && typeof t.en === "string" && !customTags.some(x => x.en === t.en)) {
            customTags.push({ zh: t.zh || "", en: t.en, neg: !!t.neg, cat: t.cat || "" });
          }
        });
      }
      if (Array.isArray(data.customOutfits)) {
        data.customOutfits.forEach(o => {
          if (o && typeof o.name === "string" && Array.isArray(o.pos) && Array.isArray(o.neg)) {
            const ex = customOutfits.find(x => x.name === o.name);
            if (ex) { ex.pos = o.pos; ex.neg = o.neg; }
            else customOutfits.push({ name: o.name, pos: o.pos, neg: o.neg });
          }
        });
      }
      if (Array.isArray(data.customTemplates)) {
        data.customTemplates.forEach(o => {
          if (o && typeof o.name === "string" && Array.isArray(o.pos) && Array.isArray(o.neg)) {
            const ex = customTemplates.find(x => x.name === o.name);
            if (ex) { ex.pos = o.pos; ex.neg = o.neg; }
            else customTemplates.push({ name: o.name, pos: o.pos, neg: o.neg });
          }
        });
      }
      if (Array.isArray(data.customCharacters)) {
        data.customCharacters.forEach(c => {
          if (c && typeof c.name === "string" && Array.isArray(c.pos) && Array.isArray(c.neg)) {
            const ex = customCharacters.find(x => x.name === c.name);
            if (ex) { ex.trigger = c.trigger || ""; ex.pos = c.pos; ex.neg = c.neg; }
            else customCharacters.push({ name: c.name, trigger: c.trigger || "", pos: c.pos, neg: c.neg });
          }
        });
      }
      if (Array.isArray(data.triggerWords)) {
        data.triggerWords.forEach(t => {
          if (t && typeof t.en === "string" && !triggerWords.some(x => x.en === t.en)) {
            triggerWords.push({ zh: t.zh || "", en: t.en });
          }
        });
      }
      savePresets();
      saveCustom();
      saveCustomOutfits();
      saveCustomTemplates();
      saveCustomCharacters();
      saveTriggers();
      rebuildCustomNeg();
      renderPresetSection();
      renderCustomSection();
      renderTriggerSection();
      renderCharacterSection();
      buildCategories();
      renderOutfitSection();
      renderTemplateSection();
      render();
    } catch (e) { alert("恢复失败：文件不是有效的备份 JSON"); }
  };
  reader.readAsText(file);
}

function applyOutfit(name) {
  const o = OUTFITS.find(x => x.name === name) || customOutfits.find(x => x.name === name);
  if (!o) return;
  snapshot();
  const applied = o.pos.length > 0 && o.pos.every(en => selected.includes(en));
  if (applied) {
    // 已应用 → 取消：移除 pos 与 neg
    o.pos.forEach(en => {
      const i = selected.indexOf(en);
      if (i >= 0) selected.splice(i, 1);
      delete weights[en];
    });
    (o.neg || []).forEach(en => {
      const i = extraNeg.indexOf(en);
      if (i >= 0) extraNeg.splice(i, 1);
    });
  } else {
    o.pos.forEach(en => {
      if (!selected.includes(en)) { selected.push(en); weights[en] = (o.w && o.w[en]) || 1.0; }
      else if (o.w && o.w[en] !== undefined) weights[en] = o.w[en];
    });
    (o.neg || []).forEach(en => { if (!extraNeg.includes(en)) extraNeg.push(en); });
  }
  render();
}

function applyCharacter(name) {
  const c = CHARACTERS.find(x => x.name === name) || customCharacters.find(x => x.name === name);
  if (!c) return;
  snapshot();
  if (c.trigger) {
    if (!triggerWords.some(t => t.en === c.trigger)) {
      triggerWords.push({ zh: c.name, en: c.trigger });
      saveTriggers();
      renderTriggerSection();
    }
    if (!selected.includes(c.trigger)) { insertSorted(c.trigger); weights[c.trigger] = 1.3; }
  }
  (c.pos || []).forEach(en => {
    if (!selected.includes(en)) { insertSorted(en); weights[en] = (c.w && c.w[en]) || 1.0; }
    else if (c.w && c.w[en] !== undefined) weights[en] = c.w[en];
  });
  (c.neg || []).forEach(en => { if (!extraNeg.includes(en)) extraNeg.push(en); });
  render();
}

};

function applyFilter(q) {
  q = q.trim().toLowerCase();
  const synEn = new Set();
  Object.keys(SYNONYMS).forEach(k => {
    if (q && k.toLowerCase().indexOf(q) !== -1) SYNONYMS[k].forEach(en => synEn.add(en));
  });
  mainEl.querySelectorAll("details").forEach(details => {
    let any = false;
    details.querySelectorAll(".chip").forEach(chip => {
      const zh = (chip.dataset.zh || "").toLowerCase();
      const en = (chip.dataset.en || "").toLowerCase();
      const search = (chip.dataset.search || "").toLowerCase();
      const show = !q || zh.indexOf(q) !== -1 || en.indexOf(q) !== -1 || search.indexOf(q) !== -1 || synEn.has(en);
      chip.style.display = show ? "" : "none";
      const parent = chip.parentElement;
      if (parent && parent.classList.contains("custom-chip")) parent.style.display = show ? "" : "none";
      if (show) any = true;
    });
    details.style.display = (!q || any) ? "" : "none";
    if (q && any) details.open = true;
  });
}

// ============ 搜索联想 + 收藏 ============
function buildTagIndex() {
  const list = [];
  CATEGORIES.forEach(c => c.tags.forEach(t => { if (!t._h) list.push({ zh: t.zh || t.en, en: t.en, neg: isNeg(t.en) }); }));
  customTags.forEach(t => list.push({ zh: t.zh || t.en, en: t.en, neg: !!t.neg }));
  triggerWords.forEach(t => list.push({ zh: t.zh || t.en, en: t.en, neg: false }));
  return list;
}

const suggestEl = document.getElementById("suggest");

function hideSuggest() { if (suggestEl) suggestEl.style.display = "none"; }

function updateSuggestions(q) {
  if (!suggestEl) return;
  q = (q || "").trim().toLowerCase();
  if (!q) { hideSuggest(); return; }
  const hits = buildTagIndex().filter(t =>
    t.en.toLowerCase().indexOf(q) !== -1 || (t.zh && t.zh.toLowerCase().indexOf(q) !== -1)
  ).slice(0, 8);
  if (hits.length === 0) { hideSuggest(); return; }
  suggestEl.innerHTML = "";
  hits.forEach(t => {
    const row = document.createElement("div");
    row.className = "suggest-item";
    const zh = document.createElement("span");
    zh.textContent = t.zh || t.en;
    const en = document.createElement("span");
    en.className = "en"; en.textContent = t.en + (t.neg ? " ⛔" : "");
    const fav = document.createElement("button");
    fav.type = "button"; fav.className = "fav" + (favorites.includes(t.en) ? " on" : "");
    fav.textContent = favorites.includes(t.en) ? "★" : "☆";
    fav.title = "收藏";
    fav.addEventListener("click", e => { e.stopPropagation(); toggleFavorite(t.en); });
    row.appendChild(zh); row.appendChild(en); row.appendChild(fav);
    row.addEventListener("mousedown", e => { e.preventDefault(); });
    row.addEventListener("click", () => { toggleTag(t.en); searchEl.value = ""; applyFilter(""); hideSuggest(); });
    suggestEl.appendChild(row);
  });
  suggestEl.style.display = "block";
}

function renderFavoriteSection() {

function copyText(text, ta, btn) {
  if (!text) return;
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  const finish = () => { btn.textContent = "已复制 ✓"; setTimeout(() => { btn.textContent = btn.dataset.label; }, 1500); };
  function fallback() {
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    finish();
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(finish, fallback);
  } else {
    fallback();
  }
}

function mergedText() {
  const neg = resultNegEl.value;

function switchTab(name) {
